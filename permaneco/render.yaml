databases:
  - name: permaneco-db
    databaseName: permaneco
    user: permaneco
    plan: free
    region: virginia

services:
  - type: web
    name: permaneco-api
    runtime: docker
    plan: free
    region: virginia
    branch: main
    rootDir: permaneco
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile.render
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: permaneco-db
          property: connectionString
      - key: DEMO_MODE
        value: "true"
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      - key: DATA_ENCRYPTION_KEYS
        value: ""
      - key: DATA_ENCRYPTION_KEY_ID
        value: default
      - key: DEMO_PASSWORD
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: SESSION_TTL_HOURS
        value: "12"
      - key: LOGIN_LOCK_MINUTES
        value: "15"
      - key: RETENTION_DAYS
        value: "90"
      - key: MAX_DAILY_TOKENS_PER_STUDENT
        value: "25000"
      - key: APP_TIMEZONE
        value: America/Sao_Paulo
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL_MAIN
        value: gemini-3.6-flash
      - key: LLM_MODEL_MAIN_FALLBACKS
        value: gemini-3.5-flash-lite
      - key: LLM_MODEL_FAST
        value: gemini-3.5-flash-lite
      - key: LLM_TIMEOUT_SECONDS
        value: "30"
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        value: ""
      - key: ALLOWED_LINK_DOMAINS
        value: cvv.org.br,gov.br,example.com

  - type: web
    name: permaneco-web
    runtime: docker
    plan: free
    region: virginia
    branch: main
    rootDir: permaneco
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    healthCheckPath: /
    envVars:
      - key: API_ORIGIN
        fromService:
          name: permaneco-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
